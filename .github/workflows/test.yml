name: Tests

on:
  pull_request:

jobs:
  test:
    name: Dune tests
    runs-on: ubuntu-latest
    env:
      DUNE_CACHE: enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            submodules: true

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.5.1+options,ocaml-option-flambda
          dune-cache: true

      - name: Build
        run: |
          opam exec -- dune build --verbose

      - name: Fetch external test fixtures
        run: |
          ./scripts/download_mf_tests.sh

      - name: Run tests
        run: |
          opam exec -- dune runtest --verbose
